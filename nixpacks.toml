# Build de Railway (Nixpacks) para la API del monorepo pnpm.
#
# Importante: se instala pnpm vía `npm install -g` en lugar de corepack.
# El corepack bundleado en Node falla al cargar pnpm 11.5.1 con
# ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING. Instalarlo por npm usa el binario
# standalone de pnpm y evita ese bug.
#
# Requiere Root Directory = raíz del repo (no apps/api) para que el workspace
# de pnpm resuelva todos los paquetes.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "npm install -g pnpm@11.5.1",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm --filter api build"]

[start]
cmd = "pnpm --filter api start"
