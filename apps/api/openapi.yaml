          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          topProducts:
                            type: array
                            items:
                              type: object
                              properties:
                                productId:
                                  type: string
                                  nullable: true
                                productName:
                                  type: string
                                totalQuantity:
                                  type: integer
                                totalRevenueCents:
                                  type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
