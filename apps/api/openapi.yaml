  # ── Orders ─────────────────────────────────────────────────────────────────

  /api/orders:
    post:
      tags: [Orders]
      summary: Crear orden desde el carrito
      description: |
        Transacción atómica: crea la orden con snapshot de precios, decrementa stock y vacía el carrito.
        La orden queda en PENDING hasta que Stripe confirme el pago.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Orden creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId:
                            type: string
                          order:
                            $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stock insuficiente o producto no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailEnvelope"

    get:
      tags: [Orders]
      summary: Listar órdenes propias (paginado)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
      responses:
        "200":
          description: Lista paginada de órdenes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Pagination"
                          - type: object
                            properties:
                              orders:
                                type: array
                                items:
                                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/orders/admin:
    get:
      tags: [Orders]
      summary: Listar todas las órdenes (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
      responses:
        "200":
          description: Lista paginada de todas las órdenes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Pagination"
                          - type: object
                            properties:
                              orders:
                                type: array
                                items:
                                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Orders]
      summary: Obtener detalle de una orden propia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orden con items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order:
                            $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Orders]
      summary: Cancelar orden propia (solo PENDING)
      description: Cancela la orden y restaura el stock.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orden cancelada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order:
                            $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La orden no está en estado PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailEnvelope"

  /api/orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Orders]
      summary: Actualizar estado de orden (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order:
                            $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Payments ───────────────────────────────────────────────────────────────

  /api/payments/checkout:
    post:
      tags: [Payments]
      summary: Crear Stripe Checkout Session para una orden
      description: |
        Crea una Checkout Session en Stripe. Devuelve `checkoutUrl`.
        El front redirige al usuario a esa URL. Stripe redirige luego al `success_url` o `cancel_url`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
      responses:
        "200":
          description: Checkout Session creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          checkoutUrl:
                            type: string
                            format: uri
                            description: URL de Stripe Checkout — redirigir al usuario aquí
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La orden ya fue pagada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailEnvelope"

  /api/payments/webhook:
    post:
      tags: [Payments]
      summary: Webhook de Stripe (solo para uso de Stripe)
      description: |
        **No llamar desde el cliente.** Solo para Stripe.
        Requiere header `stripe-signature`. Idempotente por `event.id`.
        Evento procesado: `checkout.session.completed` → orden PAID + CONFIRMED.
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Evento recibido (procesado o ya procesado previamente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          description: Firma inválida o header ausente

  # ── Reviews ────────────────────────────────────────────────────────────────

  /api/products/{productId}/reviews:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Reviews]
      summary: Listar reseñas de un producto
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: Reseñas con promedio de rating
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Pagination"
                          - type: object
                            properties:
                              reviews:
                                type: array
                                items:
                                  $ref: "#/components/schemas/Review"
                              averageRating:
                                type: number
                                nullable: true

    post:
      tags: [Reviews]
      summary: Crear reseña (una por usuario por producto)
      description: |
        `isVerifiedPurchase` se setea automáticamente si el usuario tiene una orden PAID con este producto.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Reseña creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          review:
                            $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El usuario ya dejó una reseña para este producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailEnvelope"

  /api/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    patch:
      tags: [Reviews]
      summary: Editar reseña propia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewBody"
      responses:
        "200":
          description: Reseña actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          review:
                            $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Reviews]
      summary: Borrar reseña propia (soft delete). Admin puede borrar cualquiera.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Reseña eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Wishlist ────────────────────────────────────────────────────────────────

  /api/wishlist:
    get:
      tags: [Wishlist]
      summary: Obtener lista de deseos propia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wishlist con items y producto incluido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wishlist:
                            $ref: "#/components/schemas/Wishlist"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/wishlist/items:
    post:
      tags: [Wishlist]
      summary: Agregar producto a la wishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
      responses:
        "201":
          description: Producto agregado. Devuelve wishlist actualizada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wishlist:
                            $ref: "#/components/schemas/Wishlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El producto ya está en la wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailEnvelope"

  /api/wishlist/items/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Wishlist]
      summary: Quitar producto de la wishlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Producto quitado. Devuelve wishlist actualizada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wishlist:
                            $ref: "#/components/schemas/Wishlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Analytics ───────────────────────────────────────────────────────────────

  /api/analytics/overview:
    get:
      tags: [Analytics]
      summary: Resumen general (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Totales de órdenes, revenue, usuarios y productos activos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalOrders:
                            type: integer
                          totalRevenueCents:
                            type: integer
                          totalUsers:
                            type: integer
                          totalProducts:
                            type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/analytics/orders:
    get:
      tags: [Analytics]
      summary: Órdenes agrupadas por estado (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conteo de órdenes por status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ordersByStatus:
                            type: array
                            items:
                              type: object
                              properties:
                                status:
                                  type: string
                                count:
                                  type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

