      summary: Listar productos (paginado + filtros)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: q
          in: query
          description: Búsqueda por nombre o descripción
          schema:
            type: string
        - name: categorySlug
          in: query
          description: Filtrar por una categoría (slug único, legado).
          schema:
            type: string
        - name: categorySlugs
          in: query
          description: >-
            Filtrar por múltiples categorías (un producto matchea si pertenece a
            cualquiera). Repetir el param para varios valores. Se combina con
            categorySlug si ambos se envían.
          schema:
            type: string
          style: form
          explode: true
        - name: minPrice
          in: query
          description: Precio mínimo en centavos
          schema:
            type: integer
        - name: maxPrice
          in: query
          description: Precio máximo en centavos
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
        - name: color
          in: query
          description: Filtrar por color (exacto). Repetir el param para múltiples valores.
          schema:
            type: string
          style: form
          explode: true
        - name: material
          in: query
          description: Filtrar por material (exacto). Repetir el param para múltiples valores.
          schema:
            type: string
          style: form
          explode: true
      responses:
        "200":
          description: Lista paginada de productos
          content:
