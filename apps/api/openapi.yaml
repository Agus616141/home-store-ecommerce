openapi: "3.1.0"

info:
  title: home.store API
  version: "1.0.0"
  description: API REST del e-commerce home.store — productos para el hogar

servers:
  - url: http://localhost:8080
    description: Desarrollo local

# ─── SEGURIDAD ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── SCHEMAS ────────────────────────────────────────────────────────────────

  schemas:

    # Respuestas genéricas
    SuccessEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object

    FailEnvelope:
      type: object
      required: [status, statusCode, message]
      properties:
        status:
          type: string
          enum: [fail, error]
        statusCode:
          type: integer
        message:
          type: string
        issues:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    # ─── Auth ──────────────────────────────────────────────────────────────

    UserPublic:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterBody:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthData:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
        accessToken:
          type: string

    # ─── Users ─────────────────────────────────────────────────────────────

    Address:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: string
          nullable: true
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          default: AR
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileBody:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 64
        lastName:
          type: string
          minLength: 1
          maxLength: 64
        phone:
          type: string
          maxLength: 32
          nullable: true

    ChangePasswordBody:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    CreateAddressBody:
      type: object
      required: [street, city, state, postalCode]
      properties:
        label:
          type: string
          maxLength: 64
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          default: AR
        isDefault:
          type: boolean
          default: false

    UpdateAddressBody:
      type: object
      properties:
        label:
          type: string
          nullable: true
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean

    # ─── Categories ────────────────────────────────────────────────────────

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        sortOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryWithChildren:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/Category"

    CategoryNode:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/CategoryNode"

    CreateCategoryBody:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        imageUrl:
          type: string
          format: uri
        parentId:
          type: string
        sortOrder:
          type: integer
          minimum: 0
          default: 0

    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          format: uri
          nullable: true
        parentId:
          type: string
          nullable: true
        sortOrder:
          type: integer
        isActive:
          type: boolean

    # ─── Products ──────────────────────────────────────────────────────────

    ProductImage:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        url:
          type: string
          format: uri
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ProductCategory:
      type: object
      properties:
        productId:
          type: string
        categoryId:
          type: string
        category:
          $ref: "#/components/schemas/Category"

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        priceCents:
          type: integer
          description: Precio en centavos enteros (sin floats)
        stock:
          type: integer
        sku:
          type: string
          nullable: true
        isActive:
          type: boolean
        color:
          type: string
          nullable: true
        material:
          type: string
          nullable: true
        isFeatured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            images:
              type: array
              items:
                $ref: "#/components/schemas/ProductImage"
            categories:
              type: array
              items:
                $ref: "#/components/schemas/ProductCategory"

    ProductCategorySlim:
      type: object
      properties:
        category:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string

    ProductListItem:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            images:
              type: array
              description: Solo la imagen primaria
              items:
                $ref: "#/components/schemas/ProductImage"
            categories:
              type: array
              description: Categorías del producto (slug + name)
              items:
                $ref: "#/components/schemas/ProductCategorySlim"

    CreateProductBody:
      type: object
      required: [name, slug, priceCents]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        priceCents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
          default: 0
        sku:
          type: string
        isActive:
          type: boolean
          default: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/AddImageBody"
          default: []
        categoryIds:
          type: array
          items:
            type: string
          default: []

    UpdateProductBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          nullable: true
        priceCents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        sku:
          type: string
          nullable: true
        isActive:
          type: boolean

    SetCategoriesBody:
      type: object
      required: [categoryIds]
      properties:
        categoryIds:
          type: array
          items:
            type: string

    AddImageBody:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        altText:
          type: string
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        isPrimary:
          type: boolean
          default: false

    # ─── Reviews ───────────────────────────────────────────────────────────

    ReviewAuthor:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    Review:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        userId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        isVerifiedPurchase:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/ReviewAuthor"

    CreateReviewBody:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 128
        body:
          type: string
          maxLength: 2048

    UpdateReviewBody:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true

    # ─── Wishlist ──────────────────────────────────────────────────────────

    WishlistItem:
      type: object
      properties:
        id:
          type: string
        wishlistId:
          type: string
        productId:
          type: string
        product:
          $ref: "#/components/schemas/ProductListItem"
        createdAt:
          type: string
          format: date-time

    Wishlist:
      type: object
      properties:
        id:
          type: string
          nullable: true
        userId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/WishlistItem"

    # ─── Orders ────────────────────────────────────────────────────────────

    OrderItem:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        productId:
          type: string
          nullable: true
        productName:
          type: string
        unitPriceCents:
          type: integer
        quantity:
          type: integer
        subtotalCents:
          type: integer
        createdAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
        paymentStatus:
          type: string
          enum: [PENDING, PAID, FAILED, REFUNDED]
        subtotalCents:
          type: integer
        shippingCents:
          type: integer
        taxCents:
          type: integer
        totalCents:
          type: integer
        stripeSessionId:
          type: string
          nullable: true
        shippingStreet:
          type: string
          nullable: true
        shippingCity:
          type: string
          nullable: true
        shippingState:
          type: string
          nullable: true
        shippingPostalCode:
          type: string
          nullable: true
        shippingCountry:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    CreateOrderBody:
      type: object
      properties:
        shippingAddressId:
          type: string
          description: ID de una dirección guardada del usuario. Copia snapshot al momento de la compra.
        notes:
          type: string
          maxLength: 512

    UpdateOrderStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]

    # ─── Cart ──────────────────────────────────────────────────────────────

    CartItem:
      type: object
      properties:
        id:
          type: string
        cartId:
          type: string
        productId:
          type: string
        quantity:
          type: integer
        product:
          $ref: "#/components/schemas/ProductListItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Cart:
      type: object
      properties:
        id:
          type: string
          nullable: true
        userId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"

    AddItemBody:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    UpdateItemBody:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

  # ─── RESPUESTAS REUTILIZABLES ────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailEnvelope"
    Forbidden:
      description: Sin permisos para esta acción
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailEnvelope"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailEnvelope"
    Conflict:
      description: Conflicto de unicidad (slug, email, SKU)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailEnvelope"
    BadRequest:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailEnvelope"

# ─── PATHS ────────────────────────────────────────────────────────────────────

paths:

  # ── Health ─────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [System]
      summary: Estado del servidor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Eventos en tiempo real (SSE) ───────────────────────────────────────────

  /api/events/stream:
    get:
      tags: [System]
      summary: Stream de eventos en tiempo real (Server-Sent Events)
      description: >
        Conexión SSE persistente que empuja cambios de stock y productos.
        El cuerpo es `text/event-stream`: cada evento llega como una línea
        `data: <json>` seguida de doble salto de línea. Endpoint público.
        Tipos de evento (campo `type` del JSON):
        `stock.changed`, `product.created`, `product.updated`, `product.deleted`.
      responses:
        "200":
          description: Stream SSE abierto
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stockChanged:
                  summary: Cambio de stock tras una venta o ajuste
                  value: |
                    data: {"type":"stock.changed","productId":"cmq08...","stock":47}
                productCreated:
                  summary: Producto nuevo
                  value: |
                    data: {"type":"product.created","productId":"cmq09...","slug":"silla-nordica","stock":20}
                productUpdated:
                  summary: Producto actualizado (incluye stock actual)
                  value: |
                    data: {"type":"product.updated","productId":"cmq09...","slug":"silla-nordica","stock":15}
                productDeleted:
                  summary: Producto dado de baja
                  value: |
                    data: {"type":"product.deleted","productId":"cmq09..."}

  # ── Auth ───────────────────────────────────────────────────────────────────

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Usuario creado. Devuelve accessToken. Setea cookie refreshToken (httpOnly).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login exitoso. Devuelve accessToken. Setea cookie refreshToken (httpOnly).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      description: Lee el refreshToken de la cookie httpOnly y devuelve un nuevo accessToken.
      responses:
        "200":
          description: Nuevo accessToken generado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cookie de refresh eliminada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        nullable: true
                        example: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ──────────────────────────────────────────────────────────────────

  /api/users/me:
    get:
      tags: [Users]
      summary: Obtener perfil propio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Users]
      summary: Actualizar perfil propio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users/me/password:
    patch:
      tags: [Users]
      summary: Cambiar contraseña
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        nullable: true
                        example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users/me/addresses:
    get:
      tags: [Users]
      summary: Listar direcciones propias
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de direcciones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          addresses:
                            type: array
                            items:
                              $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Users]
      summary: Crear dirección
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressBody"
      responses:
        "201":
          description: Dirección creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          address:
                            $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users/me/addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    patch:
      tags: [Users]
      summary: Actualizar dirección
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddressBody"
      responses:
        "200":
          description: Dirección actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          address:
                            $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
